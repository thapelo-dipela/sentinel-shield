# TEMPLATE. Copy to .github/workflows/ only in an OWNER-CONTROLLED release repo.
# Protect release tags, enforce reviews and maintain independent protected digest.
# This workflow has NOT run; no v2.5 release signature is included in this ZIP.
name: Sentinel Shield protected release provenance
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  attest-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stage tracked release files without .git metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sentinel-shield"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/sentinel-shield"
      - name: Validate release file inventory using independent protected digest
        shell: bash
        env:
          SENTINEL_MANIFEST_SHA256: ${{ vars.SENTINEL_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$SENTINEL_MANIFEST_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || exit 2
          python3 -B -I "$RUNNER_TEMP/sentinel-shield/scanner/verify_integrity.py" \
            --expected-manifest-sha256 "$SENTINEL_MANIFEST_SHA256"
      - name: Validate regression suite without writing bytecode
        shell: bash
        run: |
          cd "$RUNNER_TEMP/sentinel-shield"
          python3 -B -I -m unittest discover -s tests -q
      - name: Reverify inventory after test execution
        shell: bash
        env:
          SENTINEL_MANIFEST_SHA256: ${{ vars.SENTINEL_MANIFEST_SHA256 }}
        run: |
          python3 -B -I "$RUNNER_TEMP/sentinel-shield/scanner/verify_integrity.py" \
            --expected-manifest-sha256 "$SENTINEL_MANIFEST_SHA256"
      - name: Build deterministic release ZIP from verified stage
        shell: bash
        run: |
          mkdir -p dist
          python3 -B -I - "$RUNNER_TEMP/sentinel-shield" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED,ZipInfo
          import sys
          root=Path(sys.argv[1])
          with ZipFile('dist/Sentinel-Shield-verified.zip','w',compression=ZIP_DEFLATED,compresslevel=9) as out:
              for p in sorted(root.rglob('*')):
                  if p.is_symlink():raise SystemExit('Symlink in release stage')
                  if not p.is_file():continue
                  info=ZipInfo('sentinel-shield/'+p.relative_to(root).as_posix(),(2026,1,1,0,0,0));info.compress_type=ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  out.writestr(info,p.read_bytes())
          PY
          sha256sum dist/Sentinel-Shield-verified.zip > dist/SHA256-release.txt
      - name: Generate signed SLSA build-provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # verified v4.2.2 commit
        with:
          subject-path: dist/Sentinel-Shield-verified.zip
      - name: Attest the source-file CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Sentinel-Shield-verified.zip
          sbom-path: ${{ runner.temp }}/sentinel-shield/sbom/sentinel-shield.cdx.json
      - name: Upload signed release subject and digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-shield-attested-build
          path: dist/**
          retention-days: 30
