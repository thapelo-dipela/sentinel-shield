# Example only: adapt to your GitHub organization and protect the default branch.
# The PR never supplies the scanner: PR code and trusted base scanner use separate checkouts.
name: Sentinel Shield read-only PR audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted scanner from protected base branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout untrusted PR separately as audit data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: audited-pr
          persist-credentials: false
      # SENTINEL_MANIFEST_SHA256 must be configured out-of-band as an organization
      # or protected repository Actions variable, not committed or derived from the PR.
      - name: Verify trusted package inventory and required release digest
        shell: bash
        env:
          SENTINEL_MANIFEST_SHA256: ${{ vars.SENTINEL_MANIFEST_SHA256 }}
        run: |
          if [[ ! "$SENTINEL_MANIFEST_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "Missing/invalid protected SENTINEL_MANIFEST_SHA256 setting" >&2
            exit 1
          fi
          python3 -B -I trusted-base/.agents/skills/sentinel-shield/scanner/verify_integrity.py \
            --expected-manifest-sha256 "$SENTINEL_MANIFEST_SHA256"
      - name: Run host-safe read-only audit
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sentinel-reports"
          python3 -B -I trusted-base/.agents/skills/sentinel-shield/scanner/sentinel.py \
            --path audited-pr --hostile-repo --profile quick --strict \
            --out "$RUNNER_TEMP/sentinel-reports"
      - name: Upload reports even when the audit fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-security-reports
          path: ${{ runner.temp }}/sentinel-reports/**
          if-no-files-found: warn
          retention-days: 7
